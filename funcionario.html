<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tuSoluciónLSC — Panel de Andrés (App Funcionario PC)</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- MQTT over WSS + Vercel /api/session para conectar con el celular de la persona visitante mediante PIN -->
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <!-- jsPDF para descargar el historial del chat e información de videos en PDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    window.APP_FIXED_ROLE = 'desktop';
  </script>
</head>
<body class="role-desktop-only">

  <main class="workspace-container mode-desktop" id="workspace-container">
    <section class="desktop-pane-wrapper" id="desktop-pane" aria-label="Panel de Andrés"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
